
name: Extract Silkroad Hub Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o silkroad-hub-starter-1.zip -d /tmp/silkroad-project
          cp -r /tmp/silkroad-project/silkroad-hub-starter/. .

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Silkroad Hub source files" || true
          git push
