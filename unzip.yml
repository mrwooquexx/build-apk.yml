
name: Extract project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract starter project
        run: |
          mkdir -p /tmp/silkroad-project
          unzip -o .github/workflows/silkroad-hub-starter-1.zip -d /tmp/silkroad-project
          cp -r /tmp/silkroad-project/silkroad-hub-starter/. .
          rm -f .github/workflows/silkroad-hub-starter-1.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Silkroad Hub project files" || echo "No changes"
          git push
